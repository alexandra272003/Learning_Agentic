[project]
name = "sanket-agentic"
version = "0.1.0"
description = "A small stateless chatbot using the Groq API"
readme = "README.md"
authors = [
    { name = "alexandra272003", email = "alexandraoffical2003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
sanket-agentic = "sanket_agentic:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
